name: Bug
description: Something works incorrectly or crashes.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Compositor version
      description: The version in the app, or the git commit if you built from source.
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
